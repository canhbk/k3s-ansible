apiVersion: batch/v1
kind: Job
metadata:
  name: restart-k3s-vps5
  namespace: kube-system
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: vps5-h2cloud-vn
      hostNetwork: true
      hostPID: true
      restartPolicy: Never
      tolerations:
      - effect: NoSchedule
        operator: Exists
      containers:
      - name: restart-k3s
        image: alpine:3.19
        command:
        - nsenter
        - --target
        - "1"
        - --mount
        - --uts
        - --ipc
        - --net
        - --pid
        - --
        - sh
        - -c
        - |
          echo "Restarting K3s on control plane node vps5-h2cloud-vn..."
          systemctl restart k3s
          echo "K3s restart initiated"
          sleep 5
          systemctl status k3s --no-pager
        securityContext:
          privileged: true
