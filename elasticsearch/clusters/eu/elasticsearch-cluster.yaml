apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch-eu
  namespace: elasticsearch
  labels:
    cluster: eu
    environment: production
spec:
  version: 8.17.0

  http:
    tls:
      selfSignedCertificate:
        disabled: false
        subjectAltNames:
          - ip: 127.0.0.1
          - dns: localhost
          - dns: elasticsearch-eu-es-http
          - dns: elasticsearch-eu-es-http.elasticsearch
          - dns: elasticsearch-eu-es-http.elasticsearch.svc
          - dns: elasticsearch-eu-es-http.elasticsearch.svc.cluster.local

  nodeSets:
    - name: default
      count: 1

      podTemplate:
        metadata:
          labels:
            app: elasticsearch
            cluster: eu
        spec:
          initContainers:
            - name: sysctl
              securityContext:
                privileged: true
                runAsUser: 0
              command: ['sh', '-c', 'sysctl -w vm.max_map_count=262144']

          containers:
            - name: elasticsearch
              resources:
                requests:
                  memory: 2Gi
                  cpu: 500m
                limits:
                  memory: 4Gi
                  cpu: 2
              env:
                - name: ES_JAVA_OPTS
                  value: "-Xms1g -Xmx1g"

      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: longhorn-replicated
            resources:
              requests:
                storage: 10Gi

      config:
        node.store.allow_mmap: false
        xpack.monitoring.collection.enabled: true
        xpack.monitoring.elasticsearch.collection.enabled: true
        xpack.security.enabled: true
        xpack.security.http.ssl.enabled: true
        xpack.security.transport.ssl.enabled: true
