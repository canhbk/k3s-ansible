apiVersion: v1
kind: Pod
metadata:
  name: rabbitmq-test
  namespace: default
spec:
  containers:
  - name: test
    image: python:3.9-slim
    command: ["/bin/bash"]
    args: ["-c", "pip install pika && python -c \"import pika; credentials = pika.PlainCredentials('rabbitmq', 'US_RabbitMQ_Secure_Pass_2024'); connection = pika.BlockingConnection(pika.ConnectionParameters('rabbitmq.rabbitmq.svc.cluster.local', 5672, '/', credentials)); print('Connected successfully!'); connection.close()\""]
  restartPolicy: Never