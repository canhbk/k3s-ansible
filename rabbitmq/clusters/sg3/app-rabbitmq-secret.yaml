---
# RabbitMQ connection secret for applications
# Apply this to your application's namespace
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-connection
  namespace: default  # Change to your application's namespace
type: Opaque
stringData:
  # Admin user credentials (full access to all vhosts)
  RABBITMQ_ADMIN_URL: "amqp://admin:<CHANGE_ME_ADMIN_PASSWORD>@rabbitmq.rabbitmq.svc.cluster.local:5672/"
  RABBITMQ_ADMIN_USERNAME: "admin"
  RABBITMQ_ADMIN_PASSWORD: "<CHANGE_ME_ADMIN_PASSWORD>"

  # Standard user credentials (for general use)
  RABBITMQ_URL: "amqp://rabbitmq:<CHANGE_ME_USER_PASSWORD>@rabbitmq.rabbitmq.svc.cluster.local:5672/"
  RABBITMQ_USERNAME: "rabbitmq"
  RABBITMQ_PASSWORD: "<CHANGE_ME_USER_PASSWORD>"

  # Connection parameters
  RABBITMQ_HOST: "rabbitmq.rabbitmq.svc.cluster.local"
  RABBITMQ_PORT: "5672"

  # Virtual hosts
  RABBITMQ_VHOST_DEV: "murror_dev"
  RABBITMQ_VHOST_PREVIEW: "murror-preview"
  RABBITMQ_VHOST_TEST: "murror_test"

  # Full URLs for each vhost with admin user
  RABBITMQ_DEV_URL: "amqp://admin:<CHANGE_ME_ADMIN_PASSWORD>@rabbitmq.rabbitmq.svc.cluster.local:5672/murror_dev"
  RABBITMQ_PREVIEW_URL: "amqp://admin:<CHANGE_ME_ADMIN_PASSWORD>@rabbitmq.rabbitmq.svc.cluster.local:5672/murror-preview"
  RABBITMQ_TEST_URL: "amqp://admin:<CHANGE_ME_ADMIN_PASSWORD>@rabbitmq.rabbitmq.svc.cluster.local:5672/murror_test"

  # Management UI
  RABBITMQ_MANAGEMENT_URL: "http://rabbitmq.rabbitmq.svc.cluster.local:15672"
