apiVersion: v1
kind: Pod
metadata:
  name: rabbitmq-test
  namespace: rabbitmq
  labels:
    app: rabbitmq-test
spec:
  containers:
  - name: test
    image: rabbitmq:4-management-alpine
    command: ['sleep', '3600']
    env:
    - name: RABBITMQ_HOST
      value: "rabbitmq.rabbitmq.svc.cluster.local"
    - name: RABBITMQ_PORT
      value: "5672"
    - name: RABBITMQ_USER
      value: "rabbitmq"
    - name: RABBITMQ_PASS
      valueFrom:
        secretKeyRef:
          name: rabbitmq
          key: rabbitmq-password
  restartPolicy: Never
---
# Alternative: Python-based connection test
apiVersion: v1
kind: Pod
metadata:
  name: rabbitmq-python-test
  namespace: rabbitmq
  labels:
    app: rabbitmq-python-test
spec:
  containers:
  - name: test
    image: python:3.11-slim
    command: ["/bin/bash", "-c"]
    args:
      - |
        pip install pika
        python3 << 'EOF'
        import pika
        import sys
        import os

        try:
            credentials = pika.PlainCredentials(
                os.environ['RABBITMQ_USER'],
                os.environ['RABBITMQ_PASS']
            )
            connection = pika.BlockingConnection(
                pika.ConnectionParameters(
                    host=os.environ['RABBITMQ_HOST'],
                    port=int(os.environ['RABBITMQ_PORT']),
                    virtual_host='/',
                    credentials=credentials
                )
            )
            channel = connection.channel()

            # Test queue operations
            channel.queue_declare(queue='test_queue', durable=True)
            channel.basic_publish(
                exchange='',
                routing_key='test_queue',
                body='Hello RabbitMQ HA Cluster!'
            )

            method_frame, header_frame, body = channel.basic_get('test_queue')
            if body:
                print(f'✓ Successfully connected to RabbitMQ!')
                print(f'✓ Queue operations working')
                print(f'✓ Message: {body.decode()}')
                channel.basic_ack(method_frame.delivery_tag)

            # Cleanup
            channel.queue_delete(queue='test_queue')
            connection.close()

            print('✓ All tests passed!')
            sys.exit(0)
        except Exception as e:
            print(f'✗ Failed to connect: {e}')
            sys.exit(1)
        EOF
    env:
    - name: RABBITMQ_HOST
      value: "rabbitmq.rabbitmq.svc.cluster.local"
    - name: RABBITMQ_PORT
      value: "5672"
    - name: RABBITMQ_USER
      value: "rabbitmq"
    - name: RABBITMQ_PASS
      valueFrom:
        secretKeyRef:
          name: rabbitmq
          key: rabbitmq-password
  restartPolicy: Never
