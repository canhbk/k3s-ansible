apiVersion: v1
kind: Pod
metadata:
  name: rabbitmq-test
  namespace: default
spec:
  containers:
  - name: test
    image: python:3.9-slim
    command: ["/bin/bash", "-c"]
    args:
      - |
        pip install pika
        python -c "
        import pika
        import sys
        
        try:
            credentials = pika.PlainCredentials('rabbitmq', 'EU_RabbitMQ_Secure_Pass_2024_XyZ')
            connection = pika.BlockingConnection(
                pika.ConnectionParameters('rabbitmq.rabbitmq.svc.cluster.local',
                                         5672, '/', credentials))
            connection.close()
            print('Successfully connected to RabbitMQ!')
            sys.exit(0)
        except Exception as e:
            print(f'Failed to connect: {e}')
            sys.exit(1)
        "
  restartPolicy: Never