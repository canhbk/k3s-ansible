apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: default  # Change to your app's namespace
data:
  RABBITMQ_HOST: "rabbitmq.rabbitmq.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "rabbitmq"
---
# Example deployment using the ConfigMap
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-app
  template:
    metadata:
      labels:
        app: example-app
    spec:
      containers:
      - name: app
        image: your-app:latest
        envFrom:
        - configMapRef:
            name: rabbitmq-config
        env:
        - name: RABBITMQ_PASS
          valueFrom:
            secretKeyRef:
              name: rabbitmq
              namespace: rabbitmq
              key: rabbitmq-password