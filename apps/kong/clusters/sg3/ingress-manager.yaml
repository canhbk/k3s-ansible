# Ingress for Kong Manager GUI
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-manager
  namespace: kong
  annotations:
    cert-manager.io/cluster-issuer: "canhnv-com-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Basic auth middleware for security
    traefik.ingress.kubernetes.io/router.middlewares: kong-kong-manager-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kong-manager.sg3.canhnv.com
      secretName: kong-manager-tls
  rules:
    - host: kong-manager.sg3.canhnv.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong-kong-manager
                port:
                  number: 8002
