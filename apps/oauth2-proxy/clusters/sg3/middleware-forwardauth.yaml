---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy-auth
  namespace: oauth2-proxy
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - X-Auth-Request-Groups
      - X-Auth-Request-Access-Token
      - Authorization
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy-errors
  namespace: oauth2-proxy
spec:
  errors:
    status:
      - "401"
    service:
      name: oauth2-proxy
      port: 80
    query: "/oauth2/sign_in?rd={url}"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy-chain
  namespace: oauth2-proxy
spec:
  chain:
    middlewares:
      # IMPORTANT: errors middleware MUST be BEFORE forwardAuth
      # When forwardAuth returns 401, it breaks the chain and doesn't
      # trigger middlewares declared after it. By placing errors first,
      # it can intercept and handle 401 responses from forwardAuth.
      # See: https://github.com/traefik/traefik/issues/12172
      - name: oauth2-proxy-errors
      - name: oauth2-proxy-auth
