# Rancher Helm Values - Development Cluster
# Chart: rancher-2.11.2
# Last Updated: 2025-10-18

# Replica configuration
# Set to 1 due to pod stability issues on some worker nodes
# See: docs/clusters/dev/README.md for details
replicas: 1

# Hostname for Rancher UI
hostname: dev.k3s.canhnv.com

# Bootstrap password for initial admin user
bootstrapPassword: admin

# Ingress configuration
ingress:
  tls:
    # Use Let's Encrypt for TLS certificates
    source: letsEncrypt

# Let's Encrypt configuration
letsEncrypt:
  email: canhcvp1998@gmail.com
  ingress:
    class: traefik

# Resource limits and requests
# Recommended to prevent OOM issues and ensure stable operation
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# Startup probe configuration
# Extended timeout to allow CRD application to complete (up to 5 minutes)
# Default is 12 failures × 10s = 2 minutes, which is insufficient
startupProbe:
  failureThreshold: 30  # 30 failures × 10s = 5 minutes total
  periodSeconds: 10
  httpGet:
    path: /healthz
    port: 80
    scheme: HTTP

# Additional configuration options (commented for reference)
# antiAffinity: preferred  # Pod anti-affinity for HA deployments
# topologyKey: kubernetes.io/hostname

# Audit logging
auditLog:
  level: 1
  maxAge: 10
  maxBackup: 10
  maxSize: 100

# Enable additional features
# features: ""

# Global cattle settings
# global:
#   cattle:
#     psp:
#       enabled: false
