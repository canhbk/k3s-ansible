# ARC Runner Scale Set Helm Values for VN2 Cluster
# Chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
# Version: 0.13.1

# GitHub configuration
githubConfigUrl: "https://github.com/murror"

# Use pre-created Kubernetes secret for GitHub App credentials
githubConfigSecret: github-app-secret

# Runner scale set name (unique identifier)
runnerScaleSetName: "vn2-runners"

# Runner group (default for organization)
runnerGroup: "Default"

# Autoscaling configuration
minRunners: 0
maxRunners: 10

# Container mode: Docker-in-Docker for full Docker support
containerMode:
  type: "dind"

# Override runner template to use unix socket instead of TLS
# Note: Only override specific fields, not full container specs
template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: "unix:///var/run/docker.sock"
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 4000m
            memory: 8Gi

    # Node affinity - prefer worker nodes
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist

    # Tolerations for any taints
    tolerations:
      - operator: Exists

# Listener pod configuration
listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

# Controller service account (references the one created in arc-systems)
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller-gha-rs-controller
