# ARC Runner Scale Set Helm Values for VN2 Cluster
# Chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
# Version: 0.10.1

# GitHub configuration
githubConfigUrl: "https://github.com/murror"

# Use pre-created Kubernetes secret for GitHub App credentials
githubConfigSecret: github-app-secret

# Runner scale set name (unique identifier)
runnerScaleSetName: "vn2-runners"

# Runner group (default for organization)
runnerGroup: "Default"

# Autoscaling configuration
# Scale from 0 to 10 based on workflow demand
minRunners: 0
maxRunners: 10

# Container mode: Docker-in-Docker for full Docker support
containerMode:
  type: "dind"

# Runner image configuration
template:
  spec:
    # Image pull secrets for GHCR (optional - only if using private image)
    # imagePullSecrets:
    #   - name: ghcr-pull-secret

    # Init containers for setup
    initContainers: []

    # Main containers
    containers:
      # Runner container (MUST be named 'runner')
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        imagePullPolicy: Always
        command: ["/home/runner/run.sh"]

        # Environment variables
        env:
          - name: DOCKER_HOST
            value: "tcp://localhost:2376"
          - name: DOCKER_TLS_VERIFY
            value: "1"
          - name: DOCKER_CERT_PATH
            value: "/certs/client"
          - name: RUNNER_GRACEFUL_STOP_TIMEOUT
            value: "60"

        # Resource limits for runner
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 4000m
            memory: 8Gi

        # Volume mounts
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: docker-certs
            mountPath: /certs
            readOnly: true

      # Docker daemon sidecar
      - name: dind
        image: docker:27-dind
        securityContext:
          privileged: true
        env:
          - name: DOCKER_TLS_CERTDIR
            value: "/certs"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: docker-certs
            mountPath: /certs
          - name: dind-storage
            mountPath: /var/lib/docker

    # Volumes
    volumes:
      - name: work
        emptyDir: {}
      - name: docker-certs
        emptyDir: {}
      - name: dind-storage
        emptyDir: {}

    # Pod-level settings
    restartPolicy: Never
    terminationGracePeriodSeconds: 120

    # Security context
    securityContext:
      fsGroup: 1000

    # Node affinity - prefer worker nodes
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist

    # Tolerations for any taints
    tolerations:
      - operator: Exists

# Listener pod configuration
listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

# Controller service account (references the one created in arc-systems)
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller
