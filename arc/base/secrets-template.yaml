---
# GitHub App credentials secret template
# NEVER commit actual values - use this as a template
#
# To create the secret, run:
#   kubectl create secret generic github-app-secret \
#     --namespace arc-runners \
#     --from-literal=github_app_id=<APP_ID> \
#     --from-literal=github_app_installation_id=<INSTALLATION_ID> \
#     --from-file=github_app_private_key=<PATH_TO_PEM>
#
apiVersion: v1
kind: Secret
metadata:
  name: github-app-secret
  namespace: arc-runners
type: Opaque
stringData:
  github_app_id: "<GITHUB_APP_ID>"
  github_app_installation_id: "<GITHUB_APP_INSTALLATION_ID>"
  github_app_private_key: |
    -----BEGIN RSA PRIVATE KEY-----
    <PRIVATE_KEY_CONTENT>
    -----END RSA PRIVATE KEY-----
---
# GHCR pull secret for custom runner images (optional)
# Only needed if using a private container registry
#
# To create the secret, run:
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --namespace arc-runners \
#     --docker-server=ghcr.io \
#     --docker-username=<GITHUB_USERNAME> \
#     --docker-password=<GITHUB_PAT>
#
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: arc-runners
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "auth": "<BASE64_ENCODED_USERNAME:TOKEN>"
        }
      }
    }
