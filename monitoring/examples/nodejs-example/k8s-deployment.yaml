apiVersion: v1
kind: Namespace
metadata:
  name: nodejs-example
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-monitoring-example
  namespace: nodejs-example
  labels:
    app: nodejs-monitoring-example
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs-monitoring-example
  template:
    metadata:
      labels:
        app: nodejs-monitoring-example
        version: "1.0.0"
    spec:
      containers:
      - name: app
        image: nodejs-monitoring-example:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-monitoring-example
  namespace: nodejs-example
  labels:
    app: nodejs-monitoring-example
spec:
  type: ClusterIP
  selector:
    app: nodejs-monitoring-example
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 3000
    targetPort: 3000
    protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nodejs-monitoring-example
  namespace: nodejs-example
  labels:
    app: nodejs-monitoring-example
    release: kube-prometheus-stack  # Must match Prometheus serviceMonitorSelector
spec:
  selector:
    matchLabels:
      app: nodejs-monitoring-example
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    scheme: http
    honorLabels: true
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace
    - sourceLabels: [__meta_kubernetes_pod_label_version]
      targetLabel: version
---
# Optional: Ingress for external access to the app
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nodejs-monitoring-example
  namespace: nodejs-example
  annotations:
    cert-manager.io/cluster-issuer: "canhnv-com-staging"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - nodejs-example.dev.k3s.canhnv.com
    secretName: nodejs-example-tls
  rules:
  - host: nodejs-example.dev.k3s.canhnv.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nodejs-monitoring-example
            port:
              number: 80