          "options": {
            "legend": { "calcs": ["last"], "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.50, sum(rate(statistic_service_http_request_duration_seconds_bucket{namespace=\"$namespace\"}[5m])) by (le))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum(rate(statistic_service_http_request_duration_seconds_bucket{namespace=\"$namespace\"}[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.99, sum(rate(statistic_service_http_request_duration_seconds_bucket{namespace=\"$namespace\"}[5m])) by (le))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "title": "Latency (p50/p95/p99)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "bars", "fillOpacity": 80, "lineWidth": 1,
                "stacking": { "group": "A", "mode": "normal" },
                "thresholdsStyle": { "mode": "off" }
              },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 31 },
          "id": 12,
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(statistic_service_http_requests_total{namespace=\"$namespace\"}[5m])) by (route)",
              "legendFormat": "{{ route }}",
              "refId": "A"
            }
          ],
          "title": "Requests by Route",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "bars", "fillOpacity": 80, "lineWidth": 1,
                "stacking": { "group": "A", "mode": "normal" },
                "thresholdsStyle": { "mode": "off" }
              },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 31 },
          "id": 13,
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(statistic_service_http_requests_total{namespace=\"$namespace\"}[5m])) by (status_code)",
              "legendFormat": "{{ status_code }}",
              "refId": "A"
            }
          ],
          "title": "Status Code Distribution",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 39 },
          "id": 103,
          "title": "Logs",
          "type": "row"
        },
        {
          "datasource": "Loki",
          "gridPos": { "h": 12, "w": 12, "x": 0, "y": 40 },
          "id": 14,
          "options": {
            "dedupStrategy": "none", "enableLogDetails": true, "prettifyLogMessage": true,
            "showCommonLabels": false, "showLabels": false, "showTime": true,
            "sortOrder": "Descending", "wrapLogMessage": false
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{namespace=\"$namespace\", app=\"statistic-service\"}",
              "refId": "A"
            }
          ],
          "title": "Live Logs",
          "type": "logs"
        },
        {
          "datasource": "Loki",
          "gridPos": { "h": 12, "w": 12, "x": 12, "y": 40 },
          "id": 15,
          "options": {
            "dedupStrategy": "none", "enableLogDetails": true, "prettifyLogMessage": true,
            "showCommonLabels": false, "showLabels": false, "showTime": true,
            "sortOrder": "Descending", "wrapLogMessage": false
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{namespace=\"$namespace\", app=\"statistic-service\"} | json | severity=\"ERROR\"",
              "refId": "A"
            }
          ],
          "title": "Error Logs",
          "type": "logs"
        },
        {
          "datasource": "Loki",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "bars", "fillOpacity": 80, "lineWidth": 1,
                "stacking": { "group": "A", "mode": "normal" },
                "thresholdsStyle": { "mode": "off" }
              }
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 52 },
          "id": 16,
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(count_over_time({namespace=\"$namespace\", app=\"statistic-service\"} | json | severity=~\"ERROR|WARN|INFO\" [5m])) by (severity)",
              "legendFormat": "{{ severity }}",
              "refId": "A"
            }
          ],
          "title": "Log Volume by Severity",
          "type": "timeseries"
        },
        {
          "datasource": "Loki",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1,
                "showPoints": "never", "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              }
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 52 },
          "id": 17,
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(rate({namespace=\"$namespace\", app=\"statistic-service\"} | json | severity=\"ERROR\" [5m]))",
              "legendFormat": "Error Rate",
              "refId": "A"
            }
          ],
          "title": "Error Rate",
          "type": "timeseries"
        },
        {
          "datasource": "Loki",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 60 },
          "id": 18,
          "options": {
            "dedupStrategy": "none", "enableLogDetails": true, "prettifyLogMessage": true,
            "showCommonLabels": false, "showLabels": false, "showTime": true,
            "sortOrder": "Descending", "wrapLogMessage": false
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{namespace=\"$namespace\", app=\"statistic-service\"} | json | severity=\"WARN\"",
              "refId": "A"
            }
          ],
          "title": "Warning Logs",
          "type": "logs"
        }
