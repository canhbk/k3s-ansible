          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "container_memory_working_set_bytes{namespace=\"$namespace\",pod=~\"statistic-service.*\",container!=\"\",container!=\"POD\"}",
              "legendFormat": "{{pod}} - Working Set",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "container_memory_rss{namespace=\"$namespace\",pod=~\"statistic-service.*\",container!=\"\",container!=\"POD\"}",
              "legendFormat": "{{pod}} - RSS",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "container_spec_memory_limit_bytes{namespace=\"$namespace\",pod=~\"statistic-service.*\",container!=\"\",container!=\"POD\"}",
              "legendFormat": "{{pod}} - Limit",
              "refId": "C"
            }
          ],
          "title": "Memory Usage Over Time",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 22 },
          "id": 102,
          "title": "HTTP Metrics",
          "type": "row"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line", "fillOpacity": 10, "lineInterpolation": "linear",
                "lineWidth": 1, "showPoints": "never", "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 23 },
