---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loki-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus-stack  # CRITICAL: Must match Prometheus selector
    release: kube-prometheus-stack
    app.kubernetes.io/name: loki
spec:
  groups:
  - name: loki
    interval: 30s
    rules:
    # Alert when Loki has high error rate
    - alert: LokiRequestErrors
      expr: |
        100 * sum(rate(loki_request_duration_seconds_count{status_code=~"5.."}[1m])) by (namespace, job, route)
          /
        sum(rate(loki_request_duration_seconds_count[1m])) by (namespace, job, route)
          > 10
      for: 15m
      labels:
        severity: warning
        cluster: sg3
      annotations:
        summary: "Loki request error rate high"
        description: "{{ $labels.job }} {{ $labels.route }} has {{ printf \"%.2f\" $value }}% errors for the last 15 minutes"

    # Alert when Loki query latency is high
    - alert: LokiRequestLatency
      expr: |
        histogram_quantile(0.99,
          sum(rate(loki_request_duration_seconds_bucket{route=~".*query.*"}[5m])) by (le, job)
        ) > 1
      for: 15m
      labels:
        severity: warning
        cluster: sg3
      annotations:
        summary: "Loki request latency high"
        description: "{{ $labels.job }} 99th percentile latency is {{ printf \"%.2f\" $value }}s for the last 15 minutes"

    # Alert when Loki write path is down
    - alert: LokiWritePathDown
      expr: |
        up{job="loki-write"} == 0
      for: 5m
      labels:
        severity: critical
        cluster: sg3
      annotations:
        summary: "Loki write path down"
        description: "Loki write component is down - logs are not being ingested"

    # Alert when Loki read path is down
    - alert: LokiReadPathDown
      expr: |
        up{job="loki-read"} == 0
      for: 5m
      labels:
        severity: critical
        cluster: sg3
      annotations:
        summary: "Loki read path down"
        description: "Loki read component is down - log queries will fail"

    # Alert when Loki backend (compactor) is down
    - alert: LokiBackendDown
      expr: |
        up{job="loki-backend"} == 0
      for: 5m
      labels:
        severity: warning
        cluster: sg3
      annotations:
        summary: "Loki backend down"
        description: "Loki backend (compactor) is down - retention and compaction not running"

    # Alert when Promtail is not running on nodes
    - alert: PromtailNotRunning
      expr: |
        count(up{job="promtail"} == 1) < 8
      for: 10m
      labels:
        severity: warning
        cluster: sg3
      annotations:
        summary: "Promtail not running on all nodes"
        description: "Only {{ $value }} Promtail instances are running (expected 8)"

    # Alert when Loki ingester memory usage is high
    - alert: LokiIngesterMemoryHigh
      expr: |
        sum(loki_ingester_memory_chunks) by (pod) > 100000
      for: 15m
      labels:
        severity: warning
        cluster: sg3
      annotations:
        summary: "Loki ingester memory chunks high"
        description: "{{ $labels.pod }} has {{ $value }} memory chunks (may need to flush or scale)"

    # Alert when Loki is falling behind in ingestion
    - alert: LokiIngestionFallingBehind
      expr: |
        rate(loki_distributor_bytes_received_total[5m]) == 0
      for: 10m
      labels:
        severity: warning
        cluster: sg3
      annotations:
        summary: "Loki not receiving logs"
        description: "Loki has not received any logs for 10 minutes"

    # Alert when Loki compaction is failing
    - alert: LokiCompactionFailing
      expr: |
        rate(loki_compactor_runs_failed_total[1h]) > 0
      for: 30m
      labels:
        severity: warning
        cluster: sg3
      annotations:
        summary: "Loki compaction failing"
        description: "Loki compactor has had {{ $value }} failed runs in the last hour"
