apiVersion: v1
kind: ConfigMap
metadata:
  name: statistic-service-log-alert-rules
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  statistic-service-log-alerts.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: statistic-service-log-alerts
        folder: Statistic Service Alerts
        interval: 1m
        rules:
          - uid: statistic-service-error-log-detected
            title: Statistic Service - Error Log Detected
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 60
                  to: 0
                datasourceUid: P8E80F9AEF21F6940
                model:
                  expr: 'count_over_time({namespace="murror-platform", app="statistic-service"} | json | severity="ERROR" [1m])'
                  queryType: range
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 60
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  type: reduce
                  refId: B
              - refId: C
                relativeTimeRange:
                  from: 60
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  type: threshold
                  refId: C
            noDataState: NoData
            execErrState: Error
            for: 0s
            annotations:
              summary: Error logs detected in Statistic Service
              description: |
                Error logs have been detected in the Statistic Service application.
                Namespace: murror-platform
                App: statistic-service
                Check the logs for details.
            labels:
              severity: warning
              namespace: murror-platform
              app: statistic-service
              cluster: sg3

          - uid: statistic-service-high-error-rate
            title: Statistic Service - High Error Rate
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: P8E80F9AEF21F6940
                model:
                  expr: 'rate({namespace="murror-platform", app="statistic-service"} | json | severity="ERROR" [5m])'
                  queryType: range
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0.1
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  type: reduce
                  refId: B
              - refId: C
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0.1
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  type: threshold
                  refId: C
            noDataState: NoData
            execErrState: Error
            for: 5m
            annotations:
              summary: High error rate in Statistic Service
              description: |
                The error rate in Statistic Service has exceeded 0.1 errors per second for 5 minutes.
                Namespace: murror-platform
                App: statistic-service
                This indicates a potential issue that needs investigation.
            labels:
              severity: critical
              namespace: murror-platform
              app: statistic-service
              cluster: sg3
