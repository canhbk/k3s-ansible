apiVersion: v1
kind: ConfigMap
metadata:
  name: murror-ai-log-alert-rules
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  murror-ai-log-alerts.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: murror-ai-log-alerts
        folder: Murror AI Alerts
        interval: 1m
        rules:
          - uid: murror-ai-error-log-detected
            title: Murror AI - Error Log Detected
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 60
                  to: 0
                datasourceUid: P8E80F9AEF21F6940
                model:
                  expr: 'count_over_time({namespace="nsp-alpha-murror-ai", app="murror-ai"} |~ "(?i)(ERROR|CRITICAL)" [1m])'
                  queryType: range
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 60
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  type: reduce
                  refId: B
              - refId: C
                relativeTimeRange:
                  from: 60
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  type: threshold
                  refId: C
            noDataState: NoData
            execErrState: Error
            for: 0s
            annotations:
              summary: Error logs detected in Murror AI
              description: |
                Error logs have been detected in the Murror AI application.
                Namespace: nsp-alpha-murror-ai
                App: murror-ai
                Check the logs for details.
            labels:
              severity: warning
              namespace: nsp-alpha-murror-ai
              app: murror-ai
              cluster: sg3

          - uid: murror-ai-high-error-rate
            title: Murror AI - High Error Rate
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: P8E80F9AEF21F6940
                model:
                  expr: 'rate({namespace="nsp-alpha-murror-ai", app="murror-ai"} |~ "(?i)(ERROR|CRITICAL)" [5m])'
                  queryType: range
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0.1
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  type: reduce
                  refId: B
              - refId: C
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0.1
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  type: threshold
                  refId: C
            noDataState: NoData
            execErrState: Error
            for: 5m
            annotations:
              summary: High error rate in Murror AI
              description: |
                The error rate in Murror AI has exceeded 0.1 errors per second for 5 minutes.
                Namespace: nsp-alpha-murror-ai
                App: murror-ai
                This indicates a potential issue that needs investigation.
            labels:
              severity: critical
              namespace: nsp-alpha-murror-ai
              app: murror-ai
              cluster: sg3
