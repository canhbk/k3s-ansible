apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: statistic-service
  namespace: murror-platform
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: statistic-service
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
