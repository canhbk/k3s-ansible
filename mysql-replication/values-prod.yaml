architecture: replication
global:
  defaultStorageClass: longhorn
primary:
  persistence:
    enabled: true
    size: 8Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
secondary:
  replicaCount: 2
  persistence:
    enabled: true
    size: 8Gi
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
auth:
  existingSecret: my-mysql-creds
  username: appuser
  # rootPassword: s3cureRootP@ss
  # password: s3cureAppP@ss
  database: myappdb
# metrics:
#   enabled: true
