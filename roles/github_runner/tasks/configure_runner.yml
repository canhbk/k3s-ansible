---
- name: Set runner directory path for {{ org.name }}
  ansible.builtin.set_fact:
    runner_dir: "{{ runner_home }}/runners/{{ org.name }}"
    runner_name: "{{ org.runner_prefix }}-{{ runner_name_suffix }}"
    runner_labels: "{{ org.labels }}"

- name: Create runner directory for {{ org.name }}
  ansible.builtin.file:
    path: "{{ runner_dir }}"
    state: directory
    owner: "{{ runner_user }}"
    group: "{{ runner_group }}"
    mode: '0755'

- name: Extract runner package for {{ org.name }}
  ansible.builtin.unarchive:
    src: "/tmp/{{ runner_package }}"
    dest: "{{ runner_dir }}"
    remote_src: yes
    owner: "{{ runner_user }}"
    group: "{{ runner_group }}"
    creates: "{{ runner_dir }}/config.sh"

- name: Get registration token for {{ org.name }} organization
  ansible.builtin.uri:
    url: "{{ github_api_url }}/orgs/{{ org.name }}/actions/runners/registration-token"
    method: POST
    headers:
      Authorization: "Bearer {{ lookup('env', 'GITHUB_' + (org.name | upper | replace('-', '_')) + '_PAT') }}"
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
    status_code: 201
  register: registration_token
  delegate_to: localhost
  become: false

- name: Check if runner is already configured for {{ org.name }}
  ansible.builtin.stat:
    path: "{{ runner_dir }}/.runner"
  register: runner_config_file

- name: Configure runner for {{ org.name }} organization
  ansible.builtin.shell: |
    ./config.sh --url {{ github_url }}/{{ org.name }} \
      --token {{ registration_token.json.token }} \
      --name {{ runner_name }} \
      --labels {{ runner_labels }} \
      --work {{ runner_work_dir }} \
      --replace \
      --unattended
  args:
    chdir: "{{ runner_dir }}"
  become: true
  become_user: "{{ runner_user }}"
  when: not runner_config_file.stat.exists or force_reconfigure | default(false)

- name: Install runner service for {{ org.name }}
  ansible.builtin.shell: |
    ./svc.sh install {{ runner_user }}
  args:
    chdir: "{{ runner_dir }}"
  register: service_install
  failed_when: false

- name: Create systemd service file for {{ org.name }}
  ansible.builtin.template:
    src: runner.service.j2
    dest: "/etc/systemd/system/actions.runner.{{ org.name }}-{{ runner_name }}.service"
    owner: root
    group: root
    mode: '0644'
  vars:
    service_org_name: "{{ org.name }}"
    service_runner_name: "{{ runner_name }}"
    service_runner_dir: "{{ runner_dir }}"
  notify: Reload systemd

- name: Enable and start runner service for {{ org.name }}
  ansible.builtin.systemd:
    name: "actions.runner.{{ org.name }}-{{ runner_name }}"
    state: started
    enabled: yes
    daemon_reload: yes
