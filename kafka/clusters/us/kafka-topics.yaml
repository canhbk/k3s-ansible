# US Cluster Kafka Topics
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: events
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-us
spec:
  partitions: 6
  replicas: 2
  config:
    retention.ms: 604800000
    segment.bytes: 1073741824
    cleanup.policy: delete
    min.insync.replicas: 1
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-us
spec:
  partitions: 3
  replicas: 2
  config:
    retention.ms: 2592000000
    cleanup.policy: delete
    min.insync.replicas: 1
