# ClickHouse Credentials Template for VN
# Copy to secrets.local.yaml and replace <CHANGE_ME_*> placeholders with actual values
# secrets.local.yaml is gitignored
---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-credentials
  namespace: clickhouse
type: Opaque
stringData:
  admin-password: "<CHANGE_ME_ADMIN_PASSWORD>"
  app-password: "<CHANGE_ME_APP_PASSWORD>"
---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-users-config
  namespace: clickhouse
type: Opaque
stringData:
  users.xml: |
    <?xml version="1.0"?>
    <clickhouse>
      <users>
        <default>
          <password></password>
          <networks>
            <ip>127.0.0.1</ip>
            <ip>::1</ip>
          </networks>
          <profile>default</profile>
          <quota>default</quota>
        </default>
        <admin>
          <password_sha256_hex replace="replace"><CHANGE_ME_ADMIN_PASSWORD_SHA256></password_sha256_hex>
          <networks>
            <ip>::/0</ip>
          </networks>
          <profile>default</profile>
          <quota>default</quota>
          <access_management>1</access_management>
          <named_collection_control>1</named_collection_control>
        </admin>
        <app>
          <password_sha256_hex replace="replace"><CHANGE_ME_APP_PASSWORD_SHA256></password_sha256_hex>
          <networks>
            <ip>::/0</ip>
          </networks>
          <profile>app</profile>
          <quota>app</quota>
          <allow_databases>
            <database>analytics</database>
            <database>events</database>
            <database>system</database>
          </allow_databases>
        </app>
      </users>
      <profiles>
          <default>
            <max_memory_usage>6442450944</max_memory_usage>
            <max_memory_usage_for_all_queries>7516192768</max_memory_usage_for_all_queries>
            <max_execution_time>300</max_execution_time>
            <max_threads>4</max_threads>
            <use_uncompressed_cache>1</use_uncompressed_cache>
            <load_balancing>random</load_balancing>
          </default>
          <app>
            <max_memory_usage>4294967296</max_memory_usage>
            <max_execution_time>120</max_execution_time>
            <max_threads>2</max_threads>
            <readonly>0</readonly>
            <use_uncompressed_cache>1</use_uncompressed_cache>
          </app>
        </profiles>
        <quotas>
        <default>
          <interval>
            <duration>3600</duration>
            <queries>0</queries>
            <errors>0</errors>
            <result_rows>0</result_rows>
            <read_rows>0</read_rows>
            <execution_time>0</execution_time>
          </interval>
        </default>
        <app>
          <interval>
            <duration>3600</duration>
            <queries>10000</queries>
            <errors>100</errors>
            <result_rows>0</result_rows>
            <read_rows>0</read_rows>
            <execution_time>0</execution_time>
          </interval>
        </app>
      </quotas>
    </clickhouse>
