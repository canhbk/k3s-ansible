# PostgreSQL Secrets for US Master Cluster
# WARNING: This file contains sensitive data. Do not commit to version control!
#
# Usage:
# kubectl config use-context us
# kubectl apply -f secrets-us-master.yaml -n postgres-db
#
# Generate secure passwords:
# openssl rand -base64 32

---
# Superuser secret
apiVersion: v1
kind: Secret
metadata:
  name: superuser-us-master-secret
  namespace: postgres-db
  labels:
    cluster-region: us
    cluster-name: postgresql-us-master
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: <CHANGE_ME_SUPERUSER_PASSWORD>

---
# Backend user secret
apiVersion: v1
kind: Secret
metadata:
  name: be-us-master-secret
  namespace: postgres-db
  labels:
    cluster-region: us
    cluster-name: postgresql-us-master
    app: murror-backend
type: kubernetes.io/basic-auth
stringData:
  username: be
  password: <CHANGE_ME_BE_PASSWORD>
