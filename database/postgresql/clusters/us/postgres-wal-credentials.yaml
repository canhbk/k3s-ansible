# PostgreSQL WAL Archiving Credentials for US Cluster
# Generated on: 2025-08-27
# IMPORTANT: This file contains sensitive information - do not commit to git

apiVersion: v1
kind: Secret
metadata:
  name: postgres-wal-credentials
  namespace: postgres-system
type: Opaque
stringData:
  # MinIO Configuration
  MINIO_ENDPOINT: "http://<CHANGE_ME_MINIO_IP>:9000"
  BUCKET_NAME: "postgres-wal"
  
  # MinIO PostgreSQL WAL User Credentials
  POSTGRES_WAL_USER: "<CHANGE_ME_MINIO_USER>"
  POSTGRES_WAL_PASSWORD: "<CHANGE_ME_MINIO_PASSWORD>"

  # Connection string format for CloudNativePG
  # s3://bucket-name?endpoint=http://<MINIO_IP>:9000&access-key-id=<USER>&secret-access-key=<PASSWORD>&force-path-style=true
  BARMAN_S3_CONNECTION: "s3://postgres-wal?endpoint=http://<CHANGE_ME_MINIO_IP>:9000&access-key-id=<CHANGE_ME_MINIO_USER>&secret-access-key=<CHANGE_ME_MINIO_PASSWORD>&force-path-style=true"

---
