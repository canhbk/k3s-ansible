# PostgreSQL Secrets Template for Production
# WARNING: This is a template. Generate strong passwords before use!
# NEVER commit actual passwords to version control.
#
# Password Generation:
# openssl rand -base64 32
# pwgen -s 32 1
#
# Usage:
# 1. Copy this template to your cluster directory
# 2. Replace all <GENERATE_STRONG_PASSWORD> with actual passwords
# 3. Apply: kubectl apply -f secrets.yaml -n postgres-db

---
# Superuser secret
apiVersion: v1
kind: Secret
metadata:
  name: superuser-secret
  namespace: postgres-db
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: <GENERATE_STRONG_PASSWORD>

---
# Application user secrets template
# Copy and modify for each application user

# Example: Application user
apiVersion: v1
kind: Secret
metadata:
  name: app-user-secret
  namespace: postgres-db
type: kubernetes.io/basic-auth
stringData:
  username: app_user
  password: <GENERATE_STRONG_PASSWORD>

---
# Example: Read-only user
apiVersion: v1
kind: Secret
metadata:
  name: readonly-user-secret
  namespace: postgres-db
type: kubernetes.io/basic-auth
stringData:
  username: readonly_user
  password: <GENERATE_STRONG_PASSWORD>

---
# Example: Backup user
apiVersion: v1
kind: Secret
metadata:
  name: backup-user-secret
  namespace: postgres-db
type: kubernetes.io/basic-auth
stringData:
  username: backup_user
  password: <GENERATE_STRONG_PASSWORD>

---
