# PostgreSQL HA Cluster Configuration for Dev
# Using CloudNative-PG Operator with pgvector extension
#
# Prerequisites:
# 1. CloudNative-PG operator installed
# 2. Namespace created: kubectl create namespace postgres-db
# 3. Secrets applied: kubectl apply -f secrets.yaml
#
# Deploy:
# kubectl apply -f cluster.yaml

---
apiVersion: postgresql.cnpg.io/v1
kind: ClusterImageCatalog
metadata:
  name: postgresql
  namespace: postgres-db
spec:
  images:
    - major: 17
      image: pgvector/pgvector:0.8.0-pg17

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql-ha
  namespace: postgres-db
spec:
  # User/Group IDs
  postgresUID: 999
  postgresGID: 999

  # Managed roles
  managed:
    roles:
      - name: be
        login: true
        ensure: present
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        bypassrls: false
        passwordSecret:
          name: be-secret
      - name: ai
        login: true
        ensure: present
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        bypassrls: false
        passwordSecret:
          name: ai-secret
      - name: dev
        login: true
        ensure: present
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        bypassrls: false
        passwordSecret:
          name: dev-secret
      - name: vps
        login: true
        ensure: present
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        bypassrls: false
        passwordSecret:
          name: vps-secret
      - name: tester
        login: true
        ensure: present
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        bypassrls: false
        passwordSecret:
          name: tester-secret

  # Cluster configuration
  instances: 1
  enableSuperuserAccess: true
  superuserSecret:
    name: superuser-secret

  # Bootstrap configuration
  bootstrap:
    initdb:
      database: default
      owner: dev
      encoding: UTF8
      localeCollate: en_US.UTF-8
      localeCType: en_US.UTF-8
      secret:
        name: dev-secret
      postInitApplicationSQL:
        - CREATE DATABASE "murror-ai";
        - CREATE DATABASE "murror-be";
        - CREATE DATABASE "vps-management";
        # Grant schema permissions to prevent "permission denied for schema public"
        # PostgreSQL 15+ requires explicit grants for non-superuser roles
        - ALTER DATABASE "murror-ai" OWNER TO ai;
        - ALTER DATABASE "murror-be" OWNER TO be;
        - ALTER DATABASE "vps-management" OWNER TO vps;

  # Image configuration
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 17

  # Storage configuration
  storage:
    storageClass: longhorn
    size: 10Gi
