# PostgreSQL LoadBalancer Service for VPS Management Database
# WARNING: This exposes PostgreSQL to the internet - DEVELOPMENT ONLY
#
# This service provides external access to the PostgreSQL primary instance
# for the VPS management application database.
#
# Deploy:
# kubectl apply -f postgres-vps-management-loadbalancer.yaml
#
apiVersion: v1
kind: Service
metadata:
  name: postgres-vps-management
  namespace: postgres-db
  annotations:
    environment: "development"
    team: "devops"
    database: "vps-management"
    purpose: "VPS management application database access"
    warning: "DEVELOPMENT ONLY - OPEN TO INTERNET"
    created: "2025-09-10"
spec:
  type: LoadBalancer
  selector:
    cnpg.io/cluster: postgresql-ha
    cnpg.io/instanceRole: primary
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  sessionAffinity: ClientIP
  # No IP restrictions - open to internet for development access