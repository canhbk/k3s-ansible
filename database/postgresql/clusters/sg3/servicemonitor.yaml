# ServiceMonitor for PostgreSQL sg3 cluster metrics
# This configures Prometheus to scrape CNPG PostgreSQL metrics
#
# Apply: kubectl apply -f servicemonitor.yaml

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgresql-sg3-pgvector
  namespace: postgres-db
  labels:
    prometheus: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgresql-sg3-pgvector
  endpoints:
  - port: metrics
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
