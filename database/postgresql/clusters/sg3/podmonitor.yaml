# PodMonitor for PostgreSQL sg3 cluster metrics
# This configures Prometheus to scrape CNPG PostgreSQL pod metrics
#
# Apply: kubectl apply -f podmonitor.yaml

apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgresql-sg3-pgvector
  namespace: postgres-db
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgresql-sg3-pgvector
  podMetricsEndpoints:
  - port: metrics
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
