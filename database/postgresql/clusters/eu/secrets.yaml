# PostgreSQL Secrets for EU Cluster
# NOTE: These are placeholder passwords. The actual passwords will come from the VN backup restore.
# The restored database will retain VN's user passwords, not these placeholder values.
# These secrets are required by CloudNativePG but won't override restored passwords.
#
# WARNING: This file contains sensitive data. Do not commit to version control!
#
# Usage:
# kubectl apply -f secrets.yaml -n postgres-db

---
# Superuser secret
apiVersion: v1
kind: Secret
metadata:
  name: superuser-secret
  namespace: postgres-db
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: "placeholder-password-from-vn-backup"

---
# Development user secret
apiVersion: v1
kind: Secret
metadata:
  name: dev-secret
  namespace: postgres-db
type: kubernetes.io/basic-auth
stringData:
  username: dev
  password: "placeholder-password-from-vn-backup"

---
# Backend user secret
apiVersion: v1
kind: Secret
metadata:
  name: be-secret
  namespace: postgres-db
type: kubernetes.io/basic-auth
stringData:
  username: be
  password: "placeholder-password-from-vn-backup"
