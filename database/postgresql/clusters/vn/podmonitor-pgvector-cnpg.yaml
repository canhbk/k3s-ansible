# PodMonitor for PostgreSQL pgvector CNPG cluster metrics
# This configures Prometheus to scrape CNPG PostgreSQL pod metrics
#
# Apply: kubectl apply -f podmonitor-pgvector-cnpg.yaml

apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgresql-pgvector-cnpg
  namespace: postgres-db
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgresql-pgvector-cnpg
  podMetricsEndpoints:
  - port: metrics
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
