# PostgreSQL Secrets for VN Cluster
# WARNING: This file contains sensitive data. Do not commit to version control!
#
# Usage:
# kubectl apply -f secrets.yaml -n postgres-db

---
# Superuser secret
apiVersion: v1
kind: Secret
metadata:
  name: superuser-secret
  namespace: postgres-db
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: <CHANGE_ME_SUPERUSER_PASSWORD>

---
# Development user secret
apiVersion: v1
kind: Secret
metadata:
  name: dev-secret
  namespace: postgres-db
type: kubernetes.io/basic-auth
stringData:
  username: dev
  password: <CHANGE_ME_DEV_PASSWORD>

---
# Backend user secret
apiVersion: v1
kind: Secret
metadata:
  name: be-secret
  namespace: postgres-db
type: kubernetes.io/basic-auth
stringData:
  username: be
  password: <CHANGE_ME_BE_PASSWORD>
