# PostgreSQL HA Cluster with pgvector Configuration for VN
# Using CloudNative-PG Operator with pgvector extension and barman-cloud
#
# This creates a separate PostgreSQL cluster with pgvector extension
# alongside the existing postgresql-ha cluster with WAL archiving
#
# Enhanced with:
# - CloudNativePG PostgreSQL image with barman-cloud included
# - WAL archiving to MinIO (http://64.71.161.44:9000)
# - Streaming replication configuration
# - External service for replication access
#
# Prerequisites:
# 1. CloudNative-PG operator v1.26.0 installed
# 2. Namespace created: kubectl create namespace postgres-db
# 3. Secrets applied: kubectl apply -f secrets-pgvector.yaml
# 4. MinIO credentials: kubectl apply -f secrets-minio.yaml
#
# Deploy:
# kubectl apply -f cluster-pgvector-with-barman.yaml

---
apiVersion: postgresql.cnpg.io/v1
kind: ClusterImageCatalog
metadata:
  name: postgresql-pgvector-cnpg
  namespace: postgres-db
spec:
  images:
    - major: 17
      # Use CloudNativePG's PostgreSQL image which includes barman-cloud
      image: ghcr.io/cloudnative-pg/postgresql:17.2

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql-pgvector
  namespace: postgres-db
spec:
  # User/Group IDs
  postgresUID: 999
  postgresGID: 999

  # Affinity and tolerations for storage nodes
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: longhorn
              operator: In
              values:
                - "true"
    tolerations:
      - key: dedicated
        operator: Equal
        value: storage
        effect: NoSchedule

  # PostgreSQL configuration with replication settings
  postgresql:
    parameters:
      # Replication settings
      max_wal_senders: "5"
      wal_keep_size: "1GB"
      max_replication_slots: "5"
      archive_timeout: "300s"
      # Existing performance settings (if any)
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      maintenance_work_mem: "64MB"
      work_mem: "4MB"

  # WAL archiving configuration using barmanObjectStore
  backup:
    retentionPolicy: "7d"  # Keep WALs for 7 days
    target: "prefer-standby"
    barmanObjectStore:
      destinationPath: "s3://postgres-wal/pgvector-vn"
      s3Credentials:
        accessKeyId:
          name: postgresql-minio-credentials
          key: MINIO_ACCESS_KEY
        secretAccessKey:
          name: postgresql-minio-credentials
          key: MINIO_SECRET_KEY
      endpointURL: http://64.71.161.44:9000
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        immediateCheckpoint: false
        jobs: 2
      serverName: "postgresql-pgvector-vn"

  # Managed roles including replicator
  managed:
    roles:
      - name: be
        login: true
        ensure: present
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        bypassrls: false
        passwordSecret:
          name: be-pgvector-secret
      - name: ai
        login: true
        ensure: present
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        bypassrls: false
        passwordSecret:
          name: ai-pgvector-secret
      - name: dev
        login: true
        ensure: present
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        bypassrls: false
        passwordSecret:
          name: dev-pgvector-secret
      # Replicator user for external replication
      - name: replicator
        login: true
        ensure: present
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        bypassrls: false
        replication: true
        passwordSecret:
          name: streaming-replica-pgvector-secret

  # Cluster configuration
  instances: 1
  enableSuperuserAccess: true
  superuserSecret:
    name: superuser-pgvector-secret

  # Bootstrap configuration
  bootstrap:
    initdb:
      database: default
      owner: dev
      encoding: UTF8
      locale: en_US.UTF-8
      localeCType: C
      localeCollate: C
      secret:
        name: dev-pgvector-secret
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS pgvector;

  # Image configuration - Use CloudNativePG PostgreSQL image with barman-cloud
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-pgvector-cnpg
    major: 17

  # Storage configuration
  storage:
    storageClass: longhorn-vn
    size: 4Gi

  # External endpoints for replication access
  externalClusters:
    - name: postgresql-pgvector-external
      connectionParameters:
        host: postgresql-pgvector-rw.postgres-db.svc.cluster.local
        port: "5432"
        sslmode: prefer
        dbname: postgres
        user: replicator
      password:
        name: streaming-replica-pgvector-secret
        key: password

---
# Database definitions
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: murror-ai-pgvector
  namespace: postgres-db
spec:
  name: murror-ai
  owner: ai
  cluster:
    name: postgresql-pgvector

---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: murror-be-pgvector
  namespace: postgres-db
spec:
  name: murror-be
  owner: be
  cluster:
    name: postgresql-pgvector

---
# External service for streaming replication access
apiVersion: v1
kind: Service
metadata:
  name: postgresql-pgvector-replication
  namespace: postgres-db
  labels:
    cnpg.io/cluster: postgresql-pgvector
    service-type: replication
spec:
  type: LoadBalancer
  loadBalancerIP: 14.225.210.189  # Using vps33 external IP for replication
  ports:
    - port: 5433  # Different port to avoid conflict
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    cnpg.io/cluster: postgresql-pgvector
    role: primary

---
# Secret for replicator user (create this before applying)
# kubectl create secret generic streaming-replica-pgvector-secret \
#   --from-literal=username=replicator \
#   --from-literal=password=$(openssl rand -base64 32) \
#   -n postgres-db