# PostgreSQL Storage Alert Rules for VN cluster
# Uses CNPG database size metrics to monitor storage usage
#
# Apply: kubectl apply -f prometheus-alerts-storage.yaml

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgresql-vn-storage-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
  - name: postgresql-vn-storage
    interval: 30s
    rules:
    # Alert: postgresql-ha total DB size > 4GB (80% of 5Gi PVC)
    - alert: PostgreSQLHAStorageWarning
      expr: |
        (sum(cnpg_pg_database_size_bytes{namespace="postgres-db", job="postgres-db/postgresql-ha"}) / 1024 / 1024 / 1024) > 4
      for: 5m
      labels:
        severity: warning
        cluster: vn
        service: postgresql-ha
      annotations:
        summary: "PostgreSQL HA storage usage above 80%"
        description: "Database size: {{ $value | printf \"%.2f\" }}GB / 5GB available (80% threshold reached)"

    # Critical: postgresql-ha total DB size > 4.5GB (90% of 5Gi PVC)
    - alert: PostgreSQLHAStorageCritical
      expr: |
        (sum(cnpg_pg_database_size_bytes{namespace="postgres-db", job="postgres-db/postgresql-ha"}) / 1024 / 1024 / 1024) > 4.5
      for: 2m
      labels:
        severity: critical
        cluster: vn
        service: postgresql-ha
      annotations:
        summary: "PostgreSQL HA storage CRITICAL - above 90%"
        description: "Database size: {{ $value | printf \"%.2f\" }}GB / 5GB available (90% threshold) - IMMEDIATE ACTION REQUIRED"
