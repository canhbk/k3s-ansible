# PostgreSQL HA Cluster Configuration for VN
# Using CloudNative-PG Operator
#
# Prerequisites:
# 1. CloudNative-PG operator installed
# 2. Namespace created: kubectl create namespace postgres-db
# 3. Secrets applied: kubectl apply -f secrets.yaml
#
# Deploy:
# kubectl apply -f cluster.yaml

---
apiVersion: postgresql.cnpg.io/v1
kind: ClusterImageCatalog
metadata:
  name: postgresql
  namespace: postgres-db
spec:
  images:
    - major: 15
      image: ghcr.io/cloudnative-pg/postgresql:15.6
    - major: 16
      image: ghcr.io/cloudnative-pg/postgresql:16.8
    - major: 17
      image: ghcr.io/cloudnative-pg/postgresql:17.5

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql-ha
  namespace: postgres-db
spec:
  # Affinity and tolerations for storage nodes
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: longhorn
              operator: In
              values:
                - "true"
    tolerations:
      - key: dedicated
        operator: Equal
        value: storage
        effect: NoSchedule

  # Managed roles
  managed:
    roles:
      - name: be
        login: true
        ensure: present
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        bypassrls: false
        passwordSecret:
          name: be-secret
      - name: vps
        login: true
        ensure: present
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        bypassrls: false
        passwordSecret:
          name: vps-ha-secret

  # Cluster configuration
  instances: 1
  enableSuperuserAccess: true
  superuserSecret:
    name: superuser-secret

  # Bootstrap configuration
  bootstrap:
    initdb:
      database: default
      owner: dev
      encoding: UTF8
      locale: en_US.UTF-8
      secret:
        name: dev-secret
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS timescaledb;
        - CREATE SCHEMA IF NOT EXISTS partman;
        - CREATE EXTENSION IF NOT EXISTS pg_partman SCHEMA partman;
        - GRANT USAGE ON SCHEMA partman TO PUBLIC;
        - GRANT ALL ON ALL TABLES IN SCHEMA partman TO PUBLIC;
        - GRANT ALL ON ALL SEQUENCES IN SCHEMA partman TO PUBLIC;
        - GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA partman TO PUBLIC;

  # Image configuration
  imageName: ghcr.io/murror/cnpg-postgresql:17.5-ts

  # PostgreSQL configuration
  postgresql:
    shared_preload_libraries:
      - timescaledb
      - pg_partman_bgw
    parameters:
      timescaledb.max_background_workers: "8"
      timescaledb.telemetry_level: "off"
      pg_partman_bgw.dbname: "murror"

  # Storage configuration
  storage:
    storageClass: longhorn-vn
    size: 5Gi

  # Backup configuration for Cloudflare R2
  backup:
    retentionPolicy: "30d"
    target: "prefer-standby"
    barmanObjectStore:
      destinationPath: "s3://murror-api-prod-postgres-backup/postgresql-ha-vn"
      s3Credentials:
        accessKeyId:
          name: cloudflare-r2-backup-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cloudflare-r2-backup-credentials
          key: SECRET_ACCESS_KEY
      endpointURL: "https://9f2e7944fe1f73ce50daab511d91e477.r2.cloudflarestorage.com"
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        immediateCheckpoint: false
        jobs: 2
      serverName: "postgresql-ha-vn"

---
# Database definitions
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: murror
  namespace: postgres-db
spec:
  name: murror
  owner: be
  cluster:
    name: postgresql-ha

---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: vps-management-ha
  namespace: postgres-db
spec:
  name: vps-management
  owner: vps
  cluster:
    name: postgresql-ha
