# PostgreSQL HA Cluster Configuration for VN
# Using CloudNative-PG Operator
#
# Prerequisites:
# 1. CloudNative-PG operator installed
# 2. Namespace created: kubectl create namespace postgres-db
# 3. Secrets applied: kubectl apply -f secrets.yaml
#
# Deploy:
# kubectl apply -f cluster.yaml

---
apiVersion: postgresql.cnpg.io/v1
kind: ClusterImageCatalog
metadata:
  name: postgresql
  namespace: postgres-db
spec:
  images:
    - major: 15
      image: ghcr.io/cloudnative-pg/postgresql:15.6
    - major: 16
      image: ghcr.io/cloudnative-pg/postgresql:16.8
    - major: 17
      image: ghcr.io/cloudnative-pg/postgresql:17.5

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql-ha
  namespace: postgres-db
spec:
  # Affinity and tolerations for storage nodes
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: longhorn
              operator: In
              values:
                - "true"
    tolerations:
      - key: dedicated
        operator: Equal
        value: storage
        effect: NoSchedule

  # Managed roles
  managed:
    roles:
      - name: be
        login: true
        ensure: present
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        bypassrls: false
        passwordSecret:
          name: be-secret

  # Cluster configuration
  instances: 1
  enableSuperuserAccess: true
  superuserSecret:
    name: superuser-secret

  # Bootstrap configuration
  bootstrap:
    initdb:
      database: default
      owner: dev
      encoding: UTF8
      locale: en_US.UTF-8
      secret:
        name: dev-secret

  # Image configuration
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 17

  # Storage configuration
  storage:
    storageClass: longhorn-vn
    size: 5Gi

---
# Database definitions
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: murror
  namespace: postgres-db
spec:
  name: murror
  owner: be
  cluster:
    name: postgresql-ha
