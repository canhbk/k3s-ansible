# PostgreSQL LoadBalancer Service for VPS Management - VN postgresql-ha cluster
# WARNING: This exposes PostgreSQL to the internet - PRODUCTION ENVIRONMENT
#
# This service provides external access to the PostgreSQL HA primary instance
# for the VPS management application database.
#
# Deploy:
# kubectl apply -f postgres-vps-management-ha-loadbalancer.yaml
#
apiVersion: v1
kind: Service
metadata:
  name: postgres-vps-management-ha
  namespace: postgres-db
  annotations:
    environment: "production"
    team: "devops"
    database: "vps-management"
    cluster: "postgresql-ha"
    purpose: "VPS management application database access on PostgreSQL HA cluster"
    warning: "PRODUCTION - EXPOSED TO INTERNET - ENSURE STRONG PASSWORDS AND CONSIDER FIREWALL RULES"
    created: "2025-09-11"
spec:
  type: LoadBalancer
  selector:
    cnpg.io/cluster: postgresql-ha
    cnpg.io/instanceRole: primary
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  sessionAffinity: ClientIP
  # Production environment - Consider implementing IP restrictions or VPN access