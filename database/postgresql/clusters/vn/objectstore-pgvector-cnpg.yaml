# ObjectStore for postgresql-pgvector-cnpg backup to Cloudflare R2
# Uses the Barman Cloud Plugin (barman-cloud.cloudnative-pg.io)
#
# Prerequisites:
# 1. Barman Cloud Plugin deployed in cnpg-system namespace
# 2. R2 credentials secret exists: cloudflare-r2-backup-credentials
#
# Deploy:
# kubectl apply -f objectstore-pgvector-cnpg.yaml --context vn

---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: pgvector-cnpg-backup-store
  namespace: postgres-db
spec:
  configuration:
    destinationPath: "s3://murror-api-prod-postgres-backup/postgresql-pgvector-cnpg-vn"
    endpointURL: "https://9f2e7944fe1f73ce50daab511d91e477.r2.cloudflarestorage.com"
    s3Credentials:
      accessKeyId:
        name: cloudflare-r2-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cloudflare-r2-backup-credentials
        key: SECRET_ACCESS_KEY
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
      immediateCheckpoint: false
      jobs: 2
  retentionPolicy: "30d"
