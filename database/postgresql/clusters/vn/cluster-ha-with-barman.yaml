# PostgreSQL HA Cluster Configuration for VN with WAL Archiving
# Enhanced with Barman integration for cross-cluster replication
#
# This updates the existing postgresql-ha cluster with:
# - WAL archiving to MinIO (http://64.71.161.44:9000)
# - Streaming replication configuration
# - External service for replication access
#
# Prerequisites:
# 1. CloudNative-PG operator installed
# 2. Existing postgresql-ha cluster running
# 3. MinIO credentials: kubectl get secret -n postgres-db postgresql-minio-credentials
#
# Apply:
# kubectl apply -f cluster-ha-with-barman.yaml

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql-ha
  namespace: postgres-db
spec:
  # Existing configuration
  instances: 1
  postgresUID: 26
  postgresGID: 26
  
  # Image configuration
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    major: 17
    name: postgresql
  
  # Affinity configuration
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: longhorn
            operator: In
            values:
            - "true"
    tolerations:
    - effect: NoSchedule
      key: dedicated
      operator: Equal
      value: storage
  
  # PostgreSQL configuration with enhanced replication settings
  postgresql:
    parameters:
      # Existing parameters
      archive_mode: "on"
      archive_timeout: 5min
      dynamic_shared_memory_type: posix
      full_page_writes: "on"
      log_destination: csvlog
      log_directory: /controller/log
      log_filename: postgres
      log_rotation_age: "0"
      log_rotation_size: "0"
      log_truncate_on_rotation: "false"
      logging_collector: "on"
      max_parallel_workers: "32"
      max_replication_slots: "32"
      max_worker_processes: "32"
      shared_memory_type: mmap
      shared_preload_libraries: ""
      ssl_max_protocol_version: TLSv1.3
      ssl_min_protocol_version: TLSv1.3
      wal_keep_size: 512MB
      wal_level: logical
      wal_log_hints: "on"
      wal_receiver_timeout: 5s
      wal_sender_timeout: 5s
      # Enhanced replication parameters
      max_wal_senders: "5"
      # Performance settings
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      maintenance_work_mem: "64MB"
      work_mem: "4MB"
  
  # NEW: WAL archiving configuration using barmanObjectStore
  backup:
    retentionPolicy: "7d"  # Keep WALs for 7 days
    target: "prefer-standby"
    barmanObjectStore:
      destinationPath: "s3://postgres-wal/postgresql-ha-vn"
      s3Credentials:
        accessKeyId:
          name: postgresql-minio-credentials
          key: MINIO_ACCESS_KEY
        secretAccessKey:
          name: postgresql-minio-credentials
          key: MINIO_SECRET_KEY
      endpointURL: http://64.71.161.44:9000
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        immediateCheckpoint: false
        jobs: 2
      serverName: "postgresql-ha-vn"
  
  # Bootstrap configuration (existing)
  bootstrap:
    initdb:
      database: default
      encoding: UTF8
      locale: en_US.UTF-8
      localeCType: C
      localeCollate: C
      owner: dev
      secret:
        name: dev-secret
  
  # Managed roles including new replicator
  managed:
    roles:
      - name: be
        login: true
        ensure: present
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        bypassrls: false
        connectionLimit: -1
        passwordSecret:
          name: be-secret
      - name: dev
        login: true
        ensure: present
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        bypassrls: false
        passwordSecret:
          name: dev-secret
      # NEW: Replicator user for external replication
      - name: replication_user_ha
        login: true
        ensure: present
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        bypassrls: false
        replication: true
        passwordSecret:
          name: streaming-replica-ha-secret
  
  # Enable superuser access
  enableSuperuserAccess: true
  superuserSecret:
    name: superuser-secret
  
  # Storage configuration
  storage:
    size: 5Gi
    storageClass: longhorn-vn
  
  # Monitoring configuration
  monitoring:
    customQueriesConfigMap:
    - key: queries
      name: cnpg-default-monitoring
    disableDefaultQueries: false
    enablePodMonitor: false
  
  # Update strategy
  primaryUpdateMethod: restart
  primaryUpdateStrategy: unsupervised

---
# External service for streaming replication access
apiVersion: v1
kind: Service
metadata:
  name: postgresql-ha-replication
  namespace: postgres-db
  labels:
    cnpg.io/cluster: postgresql-ha
    service-type: replication
spec:
  type: LoadBalancer
  ports:
    - port: 5434  # Different port to avoid conflict with pgvector
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    cnpg.io/cluster: postgresql-ha
    cnpg.io/instanceRole: primary

---
# Secret for replication user
# This needs to be created before applying the cluster update
# kubectl create secret generic streaming-replica-ha-secret \
#   --from-literal=username=replication_user_ha \
#   --from-literal=password=$(openssl rand -base64 32) \
#   -n postgres-db