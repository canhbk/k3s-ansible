# PostgreSQL Notifications User Secret Template
# Copy this file and replace placeholders with actual values:
#   cp secrets-notifications-sample.yaml clusters/<cluster>/secrets-notifications-<cluster>.yaml
#
# Apply to cluster:
#   kubectl apply -f secrets-notifications-<cluster>.yaml -n postgres-db
#
# WARNING: Never commit the actual secrets file!
---
apiVersion: v1
kind: Secret
metadata:
  name: notifications-secret
  namespace: postgres-db
type: kubernetes.io/basic-auth
stringData:
  username: notifications
  password: "<GENERATE_SECURE_PASSWORD>"
