# Cloudflare R2 Backup Credentials Template
# Copy this file and replace placeholders with actual values:
#   cp secrets-r2-backup-sample.yaml clusters/<cluster>/secrets-r2-backup.yaml
#
# Apply to cluster:
#   kubectl apply -f secrets-r2-backup.yaml -n postgres-db
#
# WARNING: Never commit the actual secrets file!
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-r2-backup-credentials
  namespace: postgres-db
type: Opaque
stringData:
  ACCESS_KEY_ID: "<YOUR_R2_ACCESS_KEY_ID>"
  SECRET_ACCESS_KEY: "<YOUR_R2_SECRET_ACCESS_KEY>"
