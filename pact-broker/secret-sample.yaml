# Pact Broker Secrets Template
# Copy this file and replace placeholders with actual values.
#
# Apply:
#   kubectl apply -f base/secret.yaml -n pact-broker
#   kubectl apply -f database/pact-broker-db-secret.yaml -n postgres-db
#
# WARNING: Never commit the actual secrets files!
---
# App secret (apply to pact-broker namespace)
apiVersion: v1
kind: Secret
metadata:
  name: pact-broker-app-secret
  namespace: pact-broker
  labels:
    app: pact-broker
    app.kubernetes.io/name: pact-broker
type: Opaque
stringData:
  db-username: pact_broker
  db-password: "<GENERATE_SECURE_PASSWORD>"
  admin-username: pact_admin
  admin-password: "<GENERATE_SECURE_PASSWORD>"
  read-username: pact_read
  read-password: "<GENERATE_SECURE_PASSWORD>"
---
# DB credential secret (apply to postgres-db namespace)
apiVersion: v1
kind: Secret
metadata:
  name: pact-broker-db-credentials
  namespace: postgres-db
type: kubernetes.io/basic-auth
stringData:
  username: pact_broker
  password: "<SAME_AS_db-password_ABOVE>"
