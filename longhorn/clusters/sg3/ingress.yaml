---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: longhorn-auth
  namespace: longhorn-system
spec:
  basicAuth:
    secret: basic-auth
    realm: "Authentication Required"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: longhorn-internal-allow
  namespace: longhorn-system
spec:
  ipAllowList:
    sourceRange:
      - "10.54.0.0/16"  # Pod CIDR - all pods including Rancher
      - "10.55.0.0/16"  # Service CIDR - service-to-service traffic
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: longhorn-auth-chain
  namespace: longhorn-system
spec:
  chain:
    middlewares:
      - name: longhorn-internal-allow
      - name: longhorn-auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: longhorn-tls-cert
  namespace: longhorn-system
spec:
  secretName: longhorn-tls
  issuerRef:
    name: canhnv-com-prod
    kind: ClusterIssuer
  commonName: "sg3.longhorn.canhnv.com"
  dnsNames:
    - "sg3.longhorn.canhnv.com"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ingress
  namespace: longhorn-system
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: longhorn-system-longhorn-auth-chain@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - sg3.longhorn.canhnv.com
    secretName: longhorn-tls
  rules:
  - host: sg3.longhorn.canhnv.com
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: longhorn-frontend
            port:
              number: 80
