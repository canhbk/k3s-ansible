# SG3 cluster specific Longhorn values
# 8 nodes (3 control-plane + 5 workers) - production configuration

persistence:
  defaultClassReplicaCount: 3

csi:
  attacherReplicaCount: 3
  provisionerReplicaCount: 3
  resizerReplicaCount: 3
  snapshotterReplicaCount: 3

defaultSettings:
  defaultReplicaCount: 3
  replicaSoftAntiAffinity: true
  replicaAutoBalance: "best-effort"
  storageOverProvisioningPercentage: 100
  storageMinimalAvailablePercentage: 10
  concurrentReplicaRebuildPerNodeLimit: 3
  taintToleration: ""
  systemManagedComponentsNodeSelector: ""

longhornManager:
  tolerations: []
  nodeSelector: {}

longhornDriver:
  tolerations: []
  nodeSelector: {}

longhornUI:
  replicas: 2
  tolerations: []
  nodeSelector: {}

ingress:
  host: sg3.longhorn.canhnv.com
  annotations:
    cert-manager.io/cluster-issuer: canhnv-com-prod

metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      cluster: sg3
      environment: production
      region: singapore
      prometheus: kube-prometheus-stack
