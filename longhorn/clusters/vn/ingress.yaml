apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-vn-ingress
  namespace: longhorn-system
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
  - host: longhorn-vn.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: longhorn-frontend
            port:
              number: 80
  tls:
  - hosts:
    - longhorn-vn.example.com
    secretName: longhorn-vn-tls