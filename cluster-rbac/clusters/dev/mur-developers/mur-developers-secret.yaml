# ServiceAccount for developers with read-only access to specific namespaces
# This SA will be bound to namespace-specific Roles via RoleBindings
#
# Target namespaces:
# - mu-43, mu-66, mu-69, mu-70, mu-81
# - nsp-alpha-murror
# - nsp-alpha-murror-ai
#
# Updated: 2025-11-04 (Post vps7 node removal)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mur-developers
  namespace: dev-access
---
# Secret for ServiceAccount token
# Used for generating kubeconfig for developers
apiVersion: v1
kind: Secret
metadata:
  name: mur-developers-token
  namespace: dev-access
  annotations:
    kubernetes.io/service-account.name: mur-developers
type: kubernetes.io/service-account-token