# Create namespace
apiVersion: v1
kind: Namespace
metadata:
  name: dev-access
  labels:
    name: dev-access
    app: dev-access
    environment: production
    cluster: sg3
    owner: dev-team
    purpose: developer-access
    created-by: devops
    created-at: "2025-12-04"
    managed-by: devops
    version: v1
    app.kubernetes.io/instance: dev-access
    app.kubernetes.io/managed-by: devops
    app.kubernetes.io/created-by: devops
---
# Create service account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-sg3-reader
  namespace: dev-access
  labels:
    name: dev-sg3-reader
    app: dev-sg3-reader
    environment: production
    cluster: sg3
    owner: dev-team
    purpose: read-only-workload-access
    created-by: devops
    created-at: "2025-12-04"
    managed-by: devops
    version: v1
    app.kubernetes.io/instance: dev-sg3-reader
    app.kubernetes.io/managed-by: devops
    app.kubernetes.io/created-by: devops
secrets:
  - name: dev-sg3-reader-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: dev-sg3-reader-secret
  namespace: dev-access
  annotations:
    kubernetes.io/service-account.name: dev-sg3-reader
type: kubernetes.io/service-account-token
