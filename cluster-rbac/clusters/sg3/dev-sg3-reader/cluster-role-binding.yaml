apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dev-sg3-reader-binding
  labels:
    app: dev-sg3-reader
    cluster: sg3
    purpose: read-only-workload-access
subjects:
  - kind: ServiceAccount
    name: dev-sg3-reader
    namespace: dev-access
roleRef:
  kind: ClusterRole
  name: cluster-workload-reader
  apiGroup: rbac.authorization.k8s.io
