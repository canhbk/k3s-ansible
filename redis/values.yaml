
global:
  defaultStorageClass: longhorn

auth:
  enabled: true
  existingSecret: redis-password-secret
  existingSecretPasswordKey: redis-password

master:
  count: 1
  persistence:
    enabled: true
    size: 3Gi
    storageClass: longhorn
  persistentVolumeClaimRetentionPolicy:
    enabled: true
    whenDeleted: Delete
    whenScaled: Retain

replica:
  count: 3
  persistence:
    enabled: true
    size: 3Gi
    storageClass: longhorn
  persistentVolumeClaimRetentionPolicy:
    enabled: true
    whenDeleted: Delete
    whenScaled: Retain
