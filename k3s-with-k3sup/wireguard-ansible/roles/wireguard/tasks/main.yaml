- include_tasks: generate_keys.yaml

- name: Gather public keys from all hosts
  add_host:
    name: "{{ item }}"
    ansible_host: "{{ hostvars[item].ansible_host }}"
    wg_ip: "{{ hostvars[item].wg_ip }}"
    public_key: "{{ hostvars[item].my_public_key }}"
  loop: "{{ groups['all'] }}"

- name: Render wg0.conf
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/{{ wg_interface }}.conf
    mode: 0600
  become: true

- name: Enable WireGuard service to start at boot
  systemd:
    name: "wg-quick@{{ wg_interface }}"
    enabled: yes
  become: true

- name: Restart WireGuard service
  systemd:
    name: "wg-quick@{{ wg_interface }}"
    state: restarted
    daemon_reload: yes
  become: true

