apiVersion: v1
kind: Service
metadata:
  name: postgresql-ha-external
  namespace: postgres-db
  labels:
    cnpg.io/cluster: postgresql-ha
    service.type: external-access
spec:
  type: NodePort
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    protocol: TCP
    nodePort: 30432
  selector:
    cnpg.io/cluster: postgresql-ha
    cnpg.io/instanceRole: primary
  sessionAffinity: None