---
- name: Unregister GitHub Actions Self-Hosted Runners
  hosts: runner_hosts
  become: true
  gather_facts: true
  tasks:
    - name: Stop and disable runner services
      ansible.builtin.systemd:
        name: "actions.runner.{{ item.name }}-{{ item.runner_prefix }}-{{ runner_name_suffix }}"
        state: stopped
        enabled: no
      loop: "{{ github_organizations }}"
      ignore_errors: yes

    - name: Get removal token for each organization
      ansible.builtin.uri:
        url: "https://api.github.com/orgs/{{ item.name }}/actions/runners/remove-token"
        method: POST
        headers:
          Authorization: "Bearer {{ lookup('env', 'GITHUB_' + item.name | upper + '_PAT') }}"
          Accept: "application/vnd.github+json"
          X-GitHub-Api-Version: "2022-11-28"
        status_code: 201
      register: removal_tokens
      loop: "{{ github_organizations }}"
      delegate_to: localhost
      become: false

    - name: Unregister runners
      ansible.builtin.shell: |
        ./config.sh remove --token {{ item.json.token }}
      args:
        chdir: "{{ runner_home }}/runners/{{ item.item.name }}"
      loop: "{{ removal_tokens.results }}"
      become: true
      become_user: "{{ runner_user }}"
      ignore_errors: yes

    - name: Remove runner directories
      ansible.builtin.file:
        path: "{{ runner_home }}/runners"
        state: absent
