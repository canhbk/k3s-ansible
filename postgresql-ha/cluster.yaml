apiVersion: postgresql.cnpg.io/v1
kind: ClusterImageCatalog
metadata:
  name: postgresql
spec:
  images:
    - major: 15
      image: ghcr.io/cloudnative-pg/postgresql:15.6
    - major: 16
      image: ghcr.io/cloudnative-pg/postgresql:16.8
    - major: 17
      image: ghcr.io/cloudnative-pg/postgresql:17.5
---
apiVersion: v1
stringData:
  username: postgres
  password: __REDACTED__
kind: Secret
metadata:
  name: superuser-secret
type: kubernetes.io/basic-auth
---
apiVersion: v1
stringData:
  username: dev
  password: <password>
kind: Secret
metadata:
  name: dev-secret
type: kubernetes.io/basic-auth
---
apiVersion: v1
stringData:
  username: be
  password: <password>
kind: Secret
metadata:
  name: be-secret
type: kubernetes.io/basic-auth
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql-ha
spec:
  affinity:
    nodeSelector:
      node-role.kubernetes.io/postgres: ""
  managed:
    roles:
      - name: be
        login: true
        ensure: present
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        bypassrls: false
        passwordSecret:
          name: be-secret
  instances: 1
  enableSuperuserAccess: true
  superuserSecret:
    name: superuser-secret
  bootstrap:
    initdb:
      database: default
      owner: dev
      encoding: UTF8
      locale: en_US.UTF-8
      secret:
        name: dev-secret
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 17
  storage:
    storageClass: longhorn-retain
    size: 5Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: murror
spec:
  name: murror
  owner: be
  cluster:
    name: postgresql-ha
