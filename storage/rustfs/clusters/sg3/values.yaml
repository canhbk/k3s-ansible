# SG3 Cluster RustFS Standalone Configuration
# S3-compatible object storage for application storage
# Deployment Date: 2025-01-07

mode:
  standalone:
    enabled: true
  distributed:
    enabled: false

image:
  repository: rustfs/rustfs
  tag: latest
  pullPolicy: IfNotPresent

# Standalone uses single replica
replicaCount: 1

# Longhorn storage for persistence
# Note: The Helm chart uses 'storageclass' (not 'persistence') for PVC configuration
storageclass:
  name: longhorn
  dataStorageSize: 15Gi
  logStorageSize: 1Gi

# S3 API and Console credentials
secret:
  rustfs:
    access_key: rustfsadmin
    secret_key: __REDACTED__

# Ingress handled separately for cert-manager integration
ingress:
  enabled: false

# Resource limits
resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: 500m

# Service configuration
service:
  type: ClusterIP
  port: 9000
  consolePort: 9001
