# VN Cluster RustFS Standalone Configuration
# S3-compatible object storage for application storage
# Deployment Date: 2025-01-31

mode:
  standalone:
    enabled: true
  distributed:
    enabled: false

image:
  repository: rustfs/rustfs
  tag: latest
  pullPolicy: IfNotPresent

# Standalone uses single replica
replicaCount: 1

# Longhorn storage for persistence
# VN cluster storage analysis (2026-01-31):
# - vps22-vnix: DiskPressure, not schedulable
# - vps23-vnix: ~12.5GB available
# - vps24-vnix: ~13.6GB available
# - vps33-vnix-nvme-dedicated-cpu: ~69GB available but most scheduled
# - vps34-yaxg: ~15GB effectively available after reservations
# Using 15Gi to ensure reliable scheduling
storageclass:
  name: longhorn
  dataStorageSize: 15Gi
  logStorageSize: 1Gi

# S3 API and Console credentials
secret:
  rustfs:
    access_key: rustfsadmin
    secret_key: <CHANGE_ME_RUSTFS_SECRET_KEY>

# Ingress handled separately for cert-manager integration
ingress:
  enabled: false

# Resource limits
resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: 500m

# Service configuration
service:
  type: ClusterIP
  port: 9000
  consolePort: 9001
